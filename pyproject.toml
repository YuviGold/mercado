[project]
name = "mercado"
version = "0.2.1"
description = "All-In-One Development CLI Tools Multi-platform Marketplace"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["cli", "devops", "automation"]
authors = [
    { name = "YuviGold" },
]

dependencies = [
    "humanize>=4.11.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[project.urls]
Repository = "https://github.com/YuviGold/mercado"

[project.scripts]
mercado = "mercado.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "cogapp>=3.4.1",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    "N", # pep8-naming
    # isort
    "I001",
    "I002",
]
